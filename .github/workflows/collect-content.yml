name: Collect and publish content

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23,53 * * * *"

permissions:
  contents: write

concurrency:
  group: content-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - run: python scripts/collector.py
      - run: python scripts/validate.py
      - name: Commit updated feeds
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git add feeds/
            git commit -m "chore: refresh medical content feeds"
            git push
          else
            echo "No feed changes."
          fi
